sonar.projectKey=confalonieri-melisa_desapp-grupo-c
sonar.organization=confalonieri-melisa
sonar.projectName=desapp-grupo-c
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,scripts/**,**/*.py,**/*.scss,src/app/**,src/backend/db/seeds/**,src/backend/db/migrations/**
# Keep UI components in static analysis; this repository measures coverage in tested .ts modules.
sonar.coverage.exclusions=src/app/**,src/frontend/components/**,src/frontend/context/**,src/frontend/features/**/components/**,src/backend/db/seeds/**,src/backend/db/migrations/**,src/backend/db/index.ts,src/backend/db/schema.ts,src/backend/config/**,src/backend/middlewares/**,src/backend/utils/password.ts,src/backend/utils/jwt.ts
# Presentational components repeat markup by design; avoid counting that markup as code duplication.
sonar.cpd.exclusions=src/app/**,src/frontend/components/**,src/frontend/context/**,src/frontend/features/**/components/**,**/*.scss
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
