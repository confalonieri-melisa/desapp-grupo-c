services:
  postgres:
    image: postgres:17-alpine
    container_name: desapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: desapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - desapp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desapp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  desapp-postgres-data:
