openapi: 3.0.3
info:
  title: Player Quotes API
  version: 1.0.0
  description: Read-only access to persisted current and historical player quotes.
paths:
  /players/{id}/quotes:
    get:
      summary: List player quotes or resolve a quote as of a date
      tags: [Quotes]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Player UUID
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Calendar date in YYYY-MM-DD. Selects the latest quote calculated on or before this date.
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
      responses:
        '200':
          description: Quote history, or one quote when date is provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerQuotesResponse'
        '400':
          description: Invalid player UUID or date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: Player not found or no quote available for requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlayerQuotesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerQuoteResponse'
    PlayerQuoteResponse:
      type: object
      required:
        - playerId
        - quoteValue
        - unit
        - calculatedAt
        - strategyCode
        - strategyVersion
        - score
      properties:
        playerId:
          type: string
          format: uuid
        quoteValue:
          type: number
          minimum: 1
          maximum: 100
        unit:
          type: string
          example: CREDIT_PER_TOKEN
        calculatedAt:
          type: string
          format: date-time
        strategyCode:
          type: string
          enum: [INDIVIDUAL_PERFORMANCE, INDIVIDUAL_PLUS_TEAM_CONTEXT]
        strategyVersion:
          type: string
        score:
          $ref: '#/components/schemas/PlayerQuoteScore'
    PlayerQuoteScore:
      type: object
      required: [individualScore, finalScore, components]
      properties:
        individualScore:
          type: number
          minimum: 0
          maximum: 1
        teamScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        finalScore:
          type: number
          minimum: 0
          maximum: 1
        components:
          type: object
          description: Persisted QuoteExplanation projection; no recalculation is performed.
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
