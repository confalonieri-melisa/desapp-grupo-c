openapi: 3.0.3
info:
  title: Player Token Marketplace API
  description: >
    API REST para la plataforma de valuación y mercado de tokens de jugadores de fútbol.
  version: 1.0.0
  contact:
    name: DesApp Grupo C
servers:
  - url: http://localhost:3000/api
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health Check
      description: Endpoint público para verificar la disponibilidad y estado del servicio y la base de datos.
      tags:
        - System
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      summary: Registro de Usuario Inversor
      description: >
        Crea una nueva cuenta de usuario inversor, asigna automáticamente 1.000 créditos de bienvenida y confirma el registro.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El email ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Autenticación de Usuario
      description: >
        Valida credenciales de usuario y retorna un token JWT válido por 24 horas
        para consumir los endpoints protegidos vía el header `Authorization: Bearer <token>`.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso y emisión de token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /players:
    get:
      summary: Catálogo de Jugadores
      description: >
        Retorna la lista paginada de jugadores de las 5 ligas europeas oficiales.
        Permite filtrar de manera combinada por liga, equipo y posición.
        Requiere autenticación JWT.
      tags:
        - Players
      security:
        - BearerAuth: []
      parameters:
        - name: league
          in: query
          required: false
          description: Filtro por liga oficial
          schema:
            $ref: '#/components/schemas/LeagueEnum'
        - name: team
          in: query
          required: false
          description: Filtro por nombre de equipo
          schema:
            type: string
        - name: position
          in: query
          required: false
          description: Filtro por posición en el campo
          schema:
            $ref: '#/components/schemas/PositionEnum'
        - name: page
          in: query
          required: false
          description: Número de página (comienza en 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de elementos por página (máximo 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada de jugadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlayersResponse'
        '401':
          description: No autorizado - Token JWT ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /players/{id}:
    get:
      summary: Detalle de Jugador
      description: >
        Retorna la ficha biográfica y métricas completas de un jugador por su identificador único.
        Requiere autenticación JWT.
      tags:
        - Players
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del jugador
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetailResponse'
        '401':
          description: No autorizado - Token JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /players/{id}/quotes:
    get:
      summary: Historial y cotización histórica de un jugador
      description: >
        Retorna todas las cotizaciones persistidas del jugador ordenadas desde
        la más reciente. Si se informa date, retorna la última cotización
        calculada en esa fecha o antes. No recalcula la cotización.
      tags:
        - Quotes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del jugador
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Fecha calendario inclusiva en formato YYYY-MM-DD
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
      responses:
        '200':
          description: Historial completo o una única cotización cuando se informa date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerQuotesResponse'
        '400':
          description: Identificador o fecha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado - Token JWT ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jugador inexistente o cotización no disponible para la fecha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /competition-context/updates:
    post:
      summary: Sincronizar contexto colectivo
      tags:
        - Collective Context
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiveSyncRequest'
      responses:
        '200':
          description: Sincronización válida publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiveSyncResponse'
        '400':
          description: Temporada inválida
        '401':
          description: Token ausente o inválido
        '403':
          description: El usuario no es superusuario
        '429':
          description: Límite del proveedor
        '502':
          description: Proveedor no disponible o respuesta inválida
        '404':
          description: Jugador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /valuation/active:
    post:
      summary: Seleccionar la estrategia de valuación activa
      tags: [Valuation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateStrategyRequest'
      responses:
        '200':
          description: Estrategia activada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveStrategyResponse'
        '400': { description: Request inválido }
        '401': { description: Token ausente o inválido }
        '403': { description: Se requiere SUPERUSER }

  /quotes/recalculate:
    post:
      summary: Recalcular cotizaciones de todos los jugadores elegibles
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Cotizaciones calculadas o publicación parcial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculationResponse'
        '400': { description: "El body debe ser {}" }
        '401': { description: Token ausente o inválido }
        '403': { description: Se requiere SUPERUSER }
        '409': { description: No existe estrategia activa }

  /orders/buy:
    post:
      summary: Comprar tokens de un jugador
      description: Ejecuta una compra inmediata contra el único superusuario a la cotización vigente persistida.
      tags: [Market]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketOrderRequest'
      responses:
        '201':
          description: Compra ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOperationResult'
        '400': { description: Request inválido }
        '401': { description: Token ausente o inválido }
        '404': { description: Jugador, pool o cotización inexistente }
        '409': { description: Saldo o tokens insuficientes }
        '500': { description: Error inesperado sin cambios parciales }

  /orders/sell:
    post:
      summary: Vender tokens de un jugador
      description: Ejecuta una venta inmediata contra el único superusuario a la cotización vigente persistida.
      tags: [Market]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketOrderRequest'
      responses:
        '201':
          description: Venta ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOperationResult'
        '400': { description: Request inválido }
        '401': { description: Token ausente o inválido }
        '404': { description: Jugador, pool o cotización inexistente }
        '409': { description: Tenencia o saldo del pool insuficiente }
        '500': { description: Error inesperado sin cambios parciales }

  /portfolio:
    get:
      summary: Consultar portfolio del usuario autenticado
      description: Devuelve las posiciones activas del sujeto del JWT; no acepta userId.
      tags: [Market]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Portfolio del inversor autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401': { description: Token ausente o inválido }

  /users/{id}/transactions:
    get:
      summary: Consultar historial de operaciones del inversor autenticado
      description: >
        Devuelve en una única colección las operaciones BUY y SELL persistidas
        del usuario autenticado. El parámetro id debe coincidir con el sujeto
        del JWT; la consulta no reconstruye operaciones desde el portfolio.
      tags: [Market]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Historial de operaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '400': { description: UUID o paginación inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: El id no coincide con el sujeto autenticado }
        '500': { description: Error inesperado }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingrese su token JWT emitido por `/auth/login` (válido por 24 horas).

  schemas:
    CollectiveSyncRequest:
      type: object
      required:
        - season
      properties:
        season:
          type: integer
          minimum: 2000
          example: 2026

    CollectiveSyncResponse:
      type: object
      required:
        - updateId
        - season
        - status
        - competitions
      properties:
        updateId:
          type: string
          format: uuid
        season:
          type: integer
        status:
          type: string
          enum: [VALID]
        publishedAt:
          type: string
          format: date-time
        competitions:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            enum: [PL, BL1, PD, SA, FL1]

    LeagueEnum:
      type: string
      enum:
        - PREMIER_LEAGUE
        - BUNDESLIGA
        - LA_LIGA
        - SERIE_A
        - LIGUE_1
      example: LA_LIGA

    PositionEnum:
      type: string
      enum:
        - GOALKEEPER
        - DEFENDER
        - MIDFIELDER
        - FORWARD
      example: FORWARD

    UserRoleEnum:
      type: string
      enum:
        - INVESTOR
        - SUPERUSER
      example: INVESTOR

    TransactionHistoryResponse:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionHistoryItem'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    TransactionHistoryItem:
      type: object
      required: [id, type, playerId, quantity, quoteId, quoteValue, total, unit, createdAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [BUY, SELL] }
        playerId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        quoteId: { type: string, format: uuid }
        quoteValue: { type: number, format: double }
        total: { type: number, format: double }
        unit: { type: string, example: CREDIT_PER_TOKEN }
        createdAt: { type: string, format: date-time }
        correlationId: { type: string, nullable: true }

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: inversor@ejemplo.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecurePass123!
        name:
          type: string
          minLength: 2
          example: Juan Perez

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: inversor@ejemplo.com
        password:
          type: string
          format: password
          example: SecurePass123!

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        email:
          type: string
          format: email
          example: inversor@ejemplo.com
        name:
          type: string
          example: Juan Perez
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        creditBalance:
          type: number
          format: float
          example: 1000.00
        createdAt:
          type: string
          format: date-time
          example: "2026-09-12T17:00:00.000Z"

    RegisterResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: string
          example: 24h
        user:
          $ref: '#/components/schemas/UserResponse'

    PlayerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 98765432-1234-5678-9abc-def012345678
        name:
          type: string
          example: Kylian Mbappé
        team:
          type: string
          example: Real Madrid
        league:
          $ref: '#/components/schemas/LeagueEnum'
        position:
          $ref: '#/components/schemas/PositionEnum'
        statistics:
          type: object
          additionalProperties: true
          example:
            matches: 28
            minutes: 2450
            goals: 24
            assists: 8
            rating: 8.12
        currentQuote:
          type: number
          format: float
          example: 1.00
        totalTokens:
          type: integer
          example: 100

    PlayerDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 98765432-1234-5678-9abc-def012345678
        name:
          type: string
          example: Kylian Mbappé
        team:
          type: string
          example: Real Madrid
        league:
          $ref: '#/components/schemas/LeagueEnum'
        position:
          $ref: '#/components/schemas/PositionEnum'
        statistics:
          type: object
          additionalProperties: true
          example:
            matches: 28
            minutes: 2450
            goals: 24
            assists: 8
            rating: 8.12
        currentQuote:
          type: number
          format: float
          example: 1.00
        totalTokens:
          type: integer
          example: 100
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 15
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 1

    PaginatedPlayersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PlayerQuotesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerQuoteResponse'

    PlayerQuoteResponse:
      type: object
      required: [playerId, quoteValue, unit, calculatedAt, strategyCode, strategyVersion, score]
      properties:
        playerId:
          type: string
          format: uuid
        quoteValue:
          type: number
          minimum: 1
          maximum: 100
        unit:
          type: string
          example: CREDIT_PER_TOKEN
        calculatedAt:
          type: string
          format: date-time
        strategyCode:
          type: string
          enum: [INDIVIDUAL_PERFORMANCE, INDIVIDUAL_PLUS_TEAM_CONTEXT]
        strategyVersion:
          type: string
        score:
          $ref: '#/components/schemas/PlayerQuoteScore'

    PlayerQuoteScore:
      type: object
      required: [individualScore, finalScore, components]
      properties:
        individualScore:
          type: number
          minimum: 0
          maximum: 1
        teamScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        finalScore:
          type: number
          minimum: 0
          maximum: 1
        components:
          type: object
          additionalProperties: true

    MarketOrderRequest:
      type: object
      additionalProperties: false
      required: [playerId, quantity]
      properties:
        playerId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 3

    MarketOperationResult:
      type: object
      required: [operation, account, holding]
      properties:
        operation:
          type: object
          required: [id, type, userId, playerId, quantity, quoteValue, total, createdAt]
          properties:
            id: { type: string, format: uuid }
            type: { type: string, enum: [BUY, SELL] }
            userId: { type: string, format: uuid }
            playerId: { type: string, format: uuid }
            quantity: { type: integer, minimum: 1 }
            quoteValue: { type: number, format: float, minimum: 0 }
            total: { type: number, format: float, minimum: 0 }
            createdAt: { type: string, format: date-time }
        account:
          type: object
          required: [creditBalance]
          properties:
            creditBalance: { type: number, format: float, minimum: 0 }
        holding:
          type: object
          required: [quantity, averagePurchasePrice]
          properties:
            quantity: { type: integer, minimum: 0 }
            averagePurchasePrice: { type: number, format: float, minimum: 0 }

    PortfolioResponse:
      type: object
      required: [creditBalance, items]
      properties:
        creditBalance: { type: number, format: float, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [playerId, quantity, averagePurchasePrice, currentQuoteValue, currentValue, unrealizedPnl]
            properties:
              playerId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              averagePurchasePrice: { type: number, format: float, minimum: 0 }
              currentQuoteValue: { type: number, format: float, nullable: true }
              currentValue: { type: number, format: float, nullable: true }
              unrealizedPnl: { type: number, format: float, nullable: true }

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 124.5
        timestamp:
          type: string
          format: date-time
          example: "2026-09-12T17:00:00.000Z"
        database:
          type: string
          example: connected

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Missing or invalid authorization token
        statusCode:
          type: integer
          example: 401

    ActivateStrategyRequest:
      type: object
      required: [strategyCode]
      properties:
        strategyCode:
          type: string
          enum: [INDIVIDUAL_PERFORMANCE, INDIVIDUAL_PLUS_TEAM_CONTEXT]

    ActiveStrategyResponse:
      type: object
      required: [strategyCode, version, isActive]
      properties:
        strategyCode:
          type: string
          enum: [INDIVIDUAL_PERFORMANCE, INDIVIDUAL_PLUS_TEAM_CONTEXT]
        version: { type: string }
        isActive: { type: boolean }

    RecalculationResponse:
      type: object
      required: [status, season, strategyCode, version, calculated, rejected, quotes, errors]
      properties:
        status:
          type: string
          enum: [COMPLETED, PARTIAL, FAILED]
        season: { type: integer }
        strategyCode:
          type: string
          enum: [INDIVIDUAL_PERFORMANCE, INDIVIDUAL_PLUS_TEAM_CONTEXT]
        version: { type: string }
        calculated: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteResult'
        errors:
          type: array
          items:
            type: object
            required: [playerId, error]
            properties:
              playerId: { type: string, format: uuid }
              error: { type: string }

    QuoteResult:
      type: object
      required: [playerId, quoteValue, teamScore]
      properties:
        playerId: { type: string, format: uuid }
        quoteValue: { type: number, minimum: 1, maximum: 100 }
        teamScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
