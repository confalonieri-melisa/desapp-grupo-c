name: CI / Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build, Lint, Test & SonarCloud
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: desapp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d desapp_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for SonarCloud analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Database Migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/desapp_db"

      - name: Run Tests with Coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/desapp_db"
          JWT_SECRET: "secret-jwt-key-desapp-grupo-c-min-32-chars"
          NODE_ENV: "test"
          RUN_DB_INTEGRATION_TESTS: "true"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/desapp_db"
          JWT_SECRET: "secret-jwt-key-desapp-grupo-c-min-32-chars"
          NODE_ENV: "production"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
